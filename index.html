
<style>
* { box-sizing: border-box; margin: 0; padding: 0; direction: rtl; }
body { font-family: var(--font-sans); }
.app { max-width: 680px; width: 100%; }

.header { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.header-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.call-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--color-background-success); color: var(--color-text-success); font-weight: 500; }

.stages-bar { display: flex; gap: 4px; margin-bottom: 12px; }
.stage-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--color-border-tertiary); cursor: pointer; transition: background 0.2s; }
.stage-dot.done { background: #1D9E75; }
.stage-dot.active { background: #178BCA; }

.main-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 16px; margin-bottom: 10px; }

.stage-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.stage-num { width: 32px; height: 32px; border-radius: 50%; background: #178BCA; color: #fff; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stage-name { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
.stage-hint { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }

.script-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); border-right: 3px solid #178BCA; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: var(--color-text-primary); line-height: 1.7; }
.script-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px; }

.btns-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.choice-btn { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 7px 12px; font-size: 13px; background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; transition: all 0.15s; font-family: inherit; }
.choice-btn:hover { background: var(--color-background-secondary); }
.choice-btn.selected { background: #178BCA; color: #fff; border-color: #178BCA; }
.choice-btn.pain-selected { background: #D85A30; color: #fff; border-color: #D85A30; }

.section-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; margin-top: 10px; font-weight: 500; }

.questions-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.q-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); font-size: 13px; color: var(--color-text-primary); cursor: pointer; background: var(--color-background-primary); transition: all 0.15s; }
.q-item:hover { background: var(--color-background-secondary); }
.q-item.asked { background: var(--color-background-success); border-color: #1D9E75; color: var(--color-text-success); }
.q-check { width: 18px; height: 18px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.q-item.asked .q-check { background: #1D9E75; border-color: #1D9E75; color: #fff; }

.summary-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.8; color: var(--color-text-primary); border: 0.5px solid var(--color-border-tertiary); }
.summary-line { display: flex; gap: 8px; margin-bottom: 4px; }
.summary-key { color: var(--color-text-secondary); min-width: 100px; font-size: 12px; }
.summary-val { color: var(--color-text-primary); font-weight: 500; font-size: 13px; }

.generated-script { background: #E6F1FB; border-radius: var(--border-radius-md); padding: 12px 14px; border-right: 3px solid #178BCA; font-size: 13px; line-height: 1.9; color: #0C447C; margin-bottom: 12px; }

.note-input { width: 100%; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 12px; font-size: 13px; font-family: inherit; background: var(--color-background-primary); color: var(--color-text-primary); resize: none; min-height: 60px; }

.nav-row { display: flex; gap: 8px; align-items: center; }
.btn-next { flex: 1; padding: 10px; border-radius: var(--border-radius-md); border: none; background: #178BCA; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
.btn-next:hover { opacity: 0.9; }
.btn-back { padding: 10px 14px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); font-size: 13px; cursor: pointer; font-family: inherit; }
.btn-back:hover { background: var(--color-background-secondary); }

.helper-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); border: 0.5px dashed var(--color-border-secondary); padding: 10px 14px; margin-bottom: 10px; font-size: 12px; color: var(--color-text-secondary); display: flex; gap: 8px; align-items: flex-start; }
.helper-icon { color: #178BCA; flex-shrink: 0; }

.pain-level { display: flex; gap: 6px; flex-wrap: wrap; }
.pain-btn { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 6px 12px; font-size: 12px; background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.pain-btn.p1.sel { background: #EAF3DE; border-color: #639922; color: #3B6D11; }
.pain-btn.p2.sel { background: #FAEEDA; border-color: #BA7517; color: #854F0B; }
.pain-btn.p3.sel { background: #FAECE7; border-color: #993C1D; color: #712B13; }
.pain-btn.p4.sel { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }

.client-summary-mini { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mini-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
.mini-tag span { color: var(--color-text-primary); font-weight: 500; }

.start-screen { text-align: center; padding: 20px 0; }
.start-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 6px; }
.start-sub { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 20px; }
.input-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: right; }
.input-row label { font-size: 13px; color: var(--color-text-secondary); }
.input-row input { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 9px 12px; font-size: 14px; font-family: inherit; background: var(--color-background-primary); color: var(--color-text-primary); }
.btn-start { width: 100%; padding: 12px; background: #178BCA; color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }

.outcome-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.outcome-btn { border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 13px; background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; font-family: inherit; text-align: center; transition: all 0.15s; }
.outcome-btn:hover { background: var(--color-background-secondary); }
.outcome-btn.sel-won { background: #EAF3DE; border-color: #639922; color: #3B6D11; }
.outcome-btn.sel-lose { background: #FCEBEB; border-color: #A32D2D; color: #791F1F; }
.outcome-btn.sel-follow { background: #FAEEDA; border-color: #BA7517; color: #854F0B; }
.outcome-btn.sel-demo { background: #E6F1FB; border-color: #185FA5; color: #0C447C; }
.outcome-btn.sel-whatsapp { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
.outcome-btn.sel-unfit { background: #FAECE7; border-color: #993C1D; color: #712B13; }

.finish-card { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 16px; text-align: center; }
.finish-icon { font-size: 28px; color: #1D9E75; margin-bottom: 8px; }
.finish-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.finish-sub { font-size: 12px; color: var(--color-text-secondary); }
</style>

<div class="app">
  <h2 class="sr-only" style="position:absolute;left:-9999px">مساعد مكالمات تواجد - دليل البيع خطوة بخطوة</h2>

  <div id="start-view">
    <div class="main-card">
      <div class="start-screen">
        <div style="font-size:32px; color:#178BCA; margin-bottom:8px"><i class="ti ti-phone-call" aria-hidden="true"></i></div>
        <div class="start-title">Tawajud Sales Coach</div>
        <div class="start-sub">مساعدك أثناء المكالمة — خطوة بخطوة</div>
      </div>
      <div class="input-row"><label>اسم العميل</label><input id="inp-name" type="text" placeholder="مثلاً: أبو محمد"></div>
      <div class="input-row"><label>رقم الهاتف</label><input id="inp-phone" type="text" placeholder="07xxxxxxxx"></div>
      <div class="section-label">مصدر العميل</div>
      <div class="btns-grid" id="source-btns">
        <button class="choice-btn" onclick="selectSource(this,'واتساب')">واتساب</button>
        <button class="choice-btn" onclick="selectSource(this,'فيسبوك')">فيسبوك</button>
        <button class="choice-btn" onclick="selectSource(this,'إنستغرام')">إنستغرام</button>
        <button class="choice-btn" onclick="selectSource(this,'تحويل')">تحويل</button>
        <button class="choice-btn" onclick="selectSource(this,'بارد')">بارد</button>
      </div>
      <button class="btn-start" onclick="startCall()" style="margin-top:8px"><i class="ti ti-player-play" aria-hidden="true"></i> ابدأ المكالمة</button>
    </div>
  </div>

  <div id="call-view" style="display:none">
    <div class="header">
      <div>
        <div class="header-title" id="hdr-name">العميل</div>
        <div class="header-sub" id="hdr-phone"></div>
      </div>
      <div class="call-badge" id="call-timer">00:00</div>
    </div>

    <div class="stages-bar" id="stages-bar"></div>
    <div class="client-summary-mini" id="client-mini"></div>

    <div id="stage-content"></div>
  </div>
</div>

<script>
const STAGES = [
  { name: 'الافتتاح', hint: 'هدفك: تعرف منو الشخص وتكمل' },
  { name: 'معلومات العميل', hint: 'اجمع بيانات سريعة بالأزرار' },
  { name: 'اكتشاف الألم', hint: 'اطلع المشكلة الحقيقية' },
  { name: 'تأثير المشكلة', hint: 'كبّر الألم — هاي أهم مرحلة' },
  { name: 'التلخيص', hint: 'اقرأه للعميل واحصل على موافقته' },
  { name: 'عرض الحل', hint: 'اربط تواجد بمشكلته تحديداً' },
  { name: 'الخطوة التالية', hint: 'حدد نتيجة المكالمة' },
];

let state = {
  name: '', phone: '', source: '',
  stage: 0,
  biz: '', employees: '', branches: '', currentSys: '',
  pains: [], painLevel: '',
  impacts: [],
  outcome: '',
  note: '',
  askedQs: {},
  timerSec: 0,
};

let timerInt = null;

function selectSource(btn, val) {
  document.querySelectorAll('#source-btns .choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.source = val;
}

function startCall() {
  state.name = document.getElementById('inp-name').value || 'العميل';
  state.phone = document.getElementById('inp-phone').value || '';
  document.getElementById('hdr-name').textContent = state.name;
  document.getElementById('hdr-phone').textContent = state.phone;
  document.getElementById('start-view').style.display = 'none';
  document.getElementById('call-view').style.display = 'block';
  buildStagesBar();
  renderStage();
  startTimer();
}

function startTimer() {
  timerInt = setInterval(() => {
    state.timerSec++;
    const m = String(Math.floor(state.timerSec / 60)).padStart(2,'0');
    const s = String(state.timerSec % 60).padStart(2,'0');
    document.getElementById('call-timer').textContent = m + ':' + s;
  }, 1000);
}

function buildStagesBar() {
  const bar = document.getElementById('stages-bar');
  bar.innerHTML = STAGES.map((st, i) => `<div class="stage-dot" id="sdot-${i}" title="${st.name}"></div>`).join('');
  updateStagesBar();
}

function updateStagesBar() {
  STAGES.forEach((_, i) => {
    const d = document.getElementById('sdot-' + i);
    if (!d) return;
    d.className = 'stage-dot ' + (i < state.stage ? 'done' : i === state.stage ? 'active' : '');
  });
}

function updateMini() {
  const tags = [];
  if (state.biz) tags.push(`نشاط: <span>${state.biz}</span>`);
  if (state.employees) tags.push(`موظفين: <span>${state.employees}</span>`);
  if (state.branches) tags.push(`فروع: <span>${state.branches}</span>`);
  if (state.currentSys) tags.push(`نظام: <span>${state.currentSys}</span>`);
  if (state.pains.length) tags.push(`ألم: <span>${state.pains.join('، ')}</span>`);
  if (state.painLevel) tags.push(`قوة: <span>${state.painLevel}</span>`);
  document.getElementById('client-mini').innerHTML = tags.map(t => `<div class="mini-tag">${t}</div>`).join('');
}

function goNext() {
  if (state.stage < STAGES.length - 1) {
    state.stage++;
    updateStagesBar();
    updateMini();
    renderStage();
  }
}

function goBack() {
  if (state.stage > 0) {
    state.stage--;
    updateStagesBar();
    renderStage();
  }
}

function sel(arr, val) {
  const i = arr.indexOf(val);
  if (i === -1) arr.push(val); else arr.splice(i, 1);
}

function renderStage() {
  const c = document.getElementById('stage-content');
  const s = state.stage;
  const st = STAGES[s];
  let html = `<div class="main-card">
    <div class="stage-header">
      <div class="stage-num">${s+1}</div>
      <div><div class="stage-name">${st.name}</div><div class="stage-hint">${st.hint}</div></div>
    </div>`;

  if (s === 0) {
    html += `<div class="script-label">السكربت — اقرأه بصوت</div>
    <div class="script-box">مساء الخير، وياك ${state.name} من شركة تواجد.<br>لاحظنا اهتمامك بتطبيق تواجد، ممكن آخذ من وقتك دقيقتين؟<br>ممكن أعرف اسمك ومجالك؟</div>
    <div class="section-label">شلون رد العميل؟</div>
    <div class="btns-grid">
      <button class="choice-btn ${state.openResp==='موافق'?'selected':''}" onclick="state.openResp='موافق';renderStage()">موافق يكمل</button>
      <button class="choice-btn ${state.openResp==='مشغول'?'selected':''}" onclick="state.openResp='مشغول';renderStage()">مشغول</button>
      <button class="choice-btn ${state.openResp==='واتساب'?'selected':''}" onclick="state.openResp='واتساب';renderStage()">يريد واتساب</button>
      <button class="choice-btn ${state.openResp==='غير مهتم'?'selected':''}" onclick="state.openResp='غير مهتم';renderStage()">غير مهتم</button>
      <button class="choice-btn ${state.openResp==='رقم خطأ'?'selected':''}" onclick="state.openResp='رقم خطأ';renderStage()">رقم خطأ</button>
    </div>`;
    if (state.openResp === 'مشغول') {
      html += `<div class="helper-box"><i class="ti ti-info-circle helper-icon" aria-hidden="true"></i><div>قل له: متى تحب أرجع أتواصل وياك؟</div></div>
      <div class="btns-grid">
        <button class="choice-btn" onclick="state.followTime='بعد ساعة';renderStage()">بعد ساعة</button>
        <button class="choice-btn" onclick="state.followTime='اليوم بالمساء';renderStage()">اليوم بالمساء</button>
        <button class="choice-btn" onclick="state.followTime='باچر';renderStage()">باچر</button>
      </div>`;
    }
  }

  else if (s === 1) {
    html += `<div class="helper-box"><i class="ti ti-click helper-icon" aria-hidden="true"></i><div>اضغط الأزرار حسب كلامه — ما تحتاج تكتب</div></div>
    <div class="section-label">نوع النشاط</div>
    <div class="btns-grid">${['مطعم','شركة','عيادة','مدرسة','مصنع','متجر','فندق','صيدلية','غير ذلك'].map(b=>`<button class="choice-btn ${state.biz===b?'selected':''}" onclick="state.biz='${b}';renderStage()">${b}</button>`).join('')}</div>
    <div class="section-label">عدد الموظفين</div>
    <div class="btns-grid">${['أقل من 10','10-30','30-100','أكثر من 100'].map(b=>`<button class="choice-btn ${state.employees===b?'selected':''}" onclick="state.employees='${b}';renderStage()">${b}</button>`).join('')}</div>
    <div class="section-label">عدد الفروع</div>
    <div class="btns-grid">${['فرع واحد','2-3 فروع','4-10 فروع','أكثر من 10'].map(b=>`<button class="choice-btn ${state.branches===b?'selected':''}" onclick="state.branches='${b}';renderStage()">${b}</button>`).join('')}</div>
    <div class="section-label">النظام الحالي</div>
    <div class="btns-grid">${['Excel','بصمة','ورقي','نظام قديم','لا يوجد نظام'].map(b=>`<button class="choice-btn ${state.currentSys===b?'selected':''}" onclick="state.currentSys='${b}';renderStage()">${b}</button>`).join('')}</div>`;
  }

  else if (s === 2) {
    const painOpts = ['أخطاء بالرواتب','صعوبة متابعة الحضور','مشاكل الفروع','ضياع وقت بالتقارير','تحايل على الدوام','ما عندهم رؤية واضحة','تأخر الرواتب'];
    html += `<div class="script-label">اسأله</div>
    <div class="script-box">شنو أكثر مشكلة تواجهوها إدارياً حالياً؟</div>
    <div class="section-label">نقاط الألم — ممكن أكثر من واحدة</div>
    <div class="btns-grid">${painOpts.map(p=>`<button class="choice-btn ${state.pains.includes(p)?'pain-selected':''}" onclick="sel(state.pains,'${p}');renderStage()">${p}</button>`).join('')}</div>`;
    
    if (state.pains.length) {
      html += `<div class="section-label">أسئلة ذكية بناءً على المشكلة</div><div class="questions-list">`;
      const qMap = {
        'أخطاء بالرواتب': ['شكد ياخذ وقت تجهيز الرواتب نهاية الشهر؟','تصير اعتراضات من الموظفين على الرواتب؟','منو مسؤول عن تدقيقها؟'],
        'صعوبة متابعة الحضور': ['شلون يسجلون الحضور الحين؟','تصير حالات غياب بدون إشعار؟','كيف يتابع المدير الحضور؟'],
        'مشاكل الفروع': ['كيف تتواصل مع الفروع يومياً؟','منو يتابع حضور كل فرع؟','التقارير تجمعوها يدوياً؟'],
        'ضياع وقت بالتقارير': ['شكد تحتاج وقت إذا طلبت تقرير الحين؟','منو يحضر التقارير؟','التقارير عند الإدارة كافية؟'],
        'تحايل على الدوام': ['شلون تكشفون التحايل؟','صار موقف بسببها؟'],
        'تأخر الرواتب': ['شكد يتأخر الصرف عادةً؟','الموظفين يشتكون من التأخير؟'],
        'ما عندهم رؤية واضحة': ['شلون تعرف حالة كل موظف؟','عندك لوحة تحكم أو تقارير؟'],
      };
      const shown = new Set();
      state.pains.forEach(p => {
        (qMap[p]||[]).forEach(q => {
          if (!shown.has(q)) {
            shown.add(q);
            const asked = state.askedQs[q];
            html += `<div class="q-item ${asked?'asked':''}" onclick="state.askedQs['${q}']=true;renderStage()"><div class="q-check">${asked?'✓':''}</div><div>${q}</div></div>`;
          }
        });
      });
      html += '</div>';
    }
  }

  else if (s === 3) {
    html += `<div class="helper-box"><i class="ti ti-alert-triangle helper-icon" aria-hidden="true"></i><div>هاي أهم مرحلة — العميل يحتاج يحس بالمشكلة حتى السعر يصير منطقي</div></div>`;
    const impactQs = [
      'شكد وقت يضيع يومياً بسبب هاي المشكلة؟',
      'شكد مؤثرة هاي المشكلة على سير العمل؟',
      'إذا بقت نفس الطريقة 6 أشهر، شراح يصير؟',
      'إذا انحلت هاي المشكلة، شنو أكثر فرق راح ينعكس عليكم؟',
    ];
    html += `<div class="section-label">اختار الأسئلة اللي تناسب — اضغط بعد ما تسأل</div><div class="questions-list">`;
    impactQs.forEach(q => {
      const asked = state.askedQs[q];
      html += `<div class="q-item ${asked?'asked':''}" onclick="state.askedQs['${q}']=true;renderStage()"><div class="q-check">${asked?'✓':''}</div><div>${q}</div></div>`;
    });
    html += `</div><div class="section-label">قوة الألم عند العميل</div><div class="pain-level">
      <button class="pain-btn p1 ${state.painLevel==='ضعيف'?'sel':''}" onclick="state.painLevel='ضعيف';renderStage()">ضعيف</button>
      <button class="pain-btn p2 ${state.painLevel==='متوسط'?'sel':''}" onclick="state.painLevel='متوسط';renderStage()">متوسط</button>
      <button class="pain-btn p3 ${state.painLevel==='قوي'?'sel':''}" onclick="state.painLevel='قوي';renderStage()">قوي</button>
      <button class="pain-btn p4 ${state.painLevel==='قوي جداً'?'sel':''}" onclick="state.painLevel='قوي جداً';renderStage()">قوي جداً</button>
    </div>`;
  }

  else if (s === 4) {
    const biz = state.biz || '...';
    const emp = state.employees || '...';
    const sys = state.currentSys || '...';
    const pain1 = state.pains[0] || '...';
    const pain2 = state.pains[1] || '';
    const painStr = pain2 ? `${pain1} و${pain2}` : pain1;
    html += `<div class="script-label">اقرأ هذا التلخيص للعميل</div>
    <div class="generated-script">فاللي فهمته منك إن عندكم تقريباً <strong>${emp}</strong> موظف في <strong>${biz}</strong>، وتعتمدون على <strong>${sys}</strong>، وأكثر مشكلة عندكم هي <strong>${painStr}</strong>، وهذا يسبب ضغط وضياع وقت. صحيح؟</div>
    <div class="section-label">رد العميل على التلخيص</div>
    <div class="btns-grid">
      <button class="choice-btn ${state.diagAgree==='وافق'?'selected':''}" onclick="state.diagAgree='وافق';renderStage()">إي صحيح</button>
      <button class="choice-btn ${state.diagAgree==='تعديل'?'selected':''}" onclick="state.diagAgree='تعديل';renderStage()">يحتاج تعديل</button>
      <button class="choice-btn ${state.diagAgree==='رفض'?'selected':''}" onclick="state.diagAgree='رفض';renderStage()">ما وافق</button>
    </div>`;
    if (state.diagAgree === 'وافق') {
      html += `<div class="helper-box"><i class="ti ti-check helper-icon" style="color:#1D9E75" aria-hidden="true"></i><div style="color:var(--color-text-success)">ممتاز! العميل وافق على التشخيص — الآن العرض راح يكون أسهل بكثير</div></div>`;
    }
    if (state.diagAgree === 'تعديل') {
      html += `<div class="helper-box"><i class="ti ti-edit helper-icon" aria-hidden="true"></i><div>استمع للتعديل ورجع للمرحلة 2 أو 3 إذا احتجت</div></div>`;
    }
  }

  else if (s === 5) {
    const scripts = {
      'أخطاء بالرواتب': 'بما إن مشكلتكم الرئيسية بالرواتب، تواجد يقلل الأخطاء اليدوية ويحسب الرواتب تلقائياً مرتبطة بالحضور والإجازات.',
      'صعوبة متابعة الحضور': 'بما إن المشكلة بالحضور، تواجد يوفر متابعة حضور وانصراف من الموبايل مع GPS وتقارير واضحة بدون أجهزة بصمة.',
      'مشاكل الفروع': 'بما إن عندكم أكثر من فرع، تواجد يخلي الإدارة تتابع الحضور والفروع كلها من مكان واحد لحظياً.',
      'ضياع وقت بالتقارير': 'بما إن التقارير تاخذ وقت، تواجد يولد التقارير تلقائياً بضغطة وحدة.',
      'تحايل على الدوام': 'تواجد يمنع التحايل بنظام GPS دقيق وصور تسجيل دخول وتقارير تفصيلية.',
      'تأخر الرواتب': 'تواجد يسرع عملية الرواتب بربطها تلقائياً بالحضور والغياب.',
      'ما عندهم رؤية واضحة': 'تواجد يعطيك لوحة تحكم كاملة لكل موظف وكل فرع بلحظة.',
    };
    const mainPain = state.pains[0];
    const script = scripts[mainPain] || 'تواجد يجمع الحضور، الشفتات، الطلبات، الرواتب، والتقارير كلها بمكان واحد من الموبايل.';
    html += `<div class="script-label">العرض حسب مشكلة العميل</div>
    <div class="generated-script">${script}</div>
    <div class="section-label">ميزات إضافية تذكرها حسب الحاجة</div>
    <div class="btns-grid">${['حضور GPS','إدارة الشفتات','طلبات الإجازة','تقارير تفصيلية','إشعارات فورية','متابعة متعدد الفروع','احتساب رواتب تلقائي'].map(f=>`<button class="choice-btn ${(state.features||[]).includes(f)?'selected':''}" onclick="state.features=state.features||[];sel(state.features,'${f}');renderStage()">${f}</button>`).join('')}</div>`;
  }

  else if (s === 6) {
    html += `<div class="section-label">نتيجة المكالمة</div>
    <div class="outcome-grid">
      <button class="outcome-btn ${state.outcome==='demo'?'sel-demo':''}" onclick="state.outcome='demo';renderStage()"><i class="ti ti-device-desktop" aria-hidden="true"></i><br>حجز ديمو</button>
      <button class="outcome-btn ${state.outcome==='price'?'sel-demo':''}" onclick="state.outcome='price';renderStage()"><i class="ti ti-currency-dollar" aria-hidden="true"></i><br>يريد عرض سعر</button>
      <button class="outcome-btn ${state.outcome==='whatsapp'?'sel-whatsapp':''}" onclick="state.outcome='whatsapp';renderStage()"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i><br>يريد واتساب</button>
      <button class="outcome-btn ${state.outcome==='follow'?'sel-follow':''}" onclick="state.outcome='follow';renderStage()"><i class="ti ti-clock" aria-hidden="true"></i><br>يحتاج متابعة</button>
      <button class="outcome-btn ${state.outcome==='unfit'?'sel-lose':''}" onclick="state.outcome='unfit';renderStage()"><i class="ti ti-x" aria-hidden="true"></i><br>غير مؤهل</button>
      <button class="outcome-btn ${state.outcome==='notinterested'?'sel-lose':''}" onclick="state.outcome='notinterested';renderStage()"><i class="ti ti-thumb-down" aria-hidden="true"></i><br>غير مهتم</button>
    </div>`;

    const scriptMap = {
      'demo': 'تحب أخليك تشوف ديمو سريع حتى أوضحلك شلون راح تنحل هاي النقطة عملياً؟',
      'price': 'أكيد أوضحلك السعر، بس خليني أتأكد من عدد الموظفين والفروع حتى أنطيك الباقة المناسبة.',
      'follow': 'تمام، متى يكون أفضل وقت أرجع أتواصل وياك؟',
      'whatsapp': 'أرسللك تفاصيل تواجد على الواتساب، هذا رقمك الصح؟',
    };
    if (scriptMap[state.outcome]) {
      html += `<div class="script-label">قل له</div><div class="script-box">${scriptMap[state.outcome]}</div>`;
    }

    html += `<div class="section-label">ملاحظة سريعة (اختياري)</div>
    <textarea class="note-input" id="note-inp" placeholder="أي تفصيل مهم..." oninput="state.note=this.value">${state.note}</textarea>`;

    if (state.outcome) {
      html += `<button class="btn-next" style="margin-top:12px" onclick="finishCall()"><i class="ti ti-check" aria-hidden="true"></i> حفظ وإنهاء المكالمة</button>`;
    }
  }

  if (s < 6) {
    html += `<div class="nav-row" style="margin-top:14px">`;
    if (s > 0) html += `<button class="btn-back" onclick="goBack()"><i class="ti ti-arrow-right" aria-hidden="true"></i></button>`;
    html += `<button class="btn-next" onclick="goNext()">التالي — ${STAGES[s+1]?.name || 'إنهاء'} <i class="ti ti-arrow-left" aria-hidden="true"></i></button></div>`;
  } else if (!state.outcome) {
    html += `<div class="nav-row" style="margin-top:14px"><button class="btn-back" onclick="goBack()"><i class="ti ti-arrow-right" aria-hidden="true"></i></button></div>`;
  }

  html += `</div>`;
  c.innerHTML = html;

  if (s === 6 && state.note) {
    const ni = document.getElementById('note-inp');
    if (ni) ni.value = state.note;
  }
}

function finishCall() {
  clearInterval(timerInt);
  const m = String(Math.floor(state.timerSec / 60)).padStart(2,'0');
  const s2 = String(state.timerSec % 60).padStart(2,'0');
  const outcomeLabels = { demo:'حجز ديمو', price:'عرض سعر', whatsapp:'واتساب', follow:'متابعة', unfit:'غير مؤهل', notinterested:'غير مهتم' };
  
  document.getElementById('stage-content').innerHTML = `
    <div class="main-card">
      <div class="finish-card">
        <div class="finish-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
        <div class="finish-title">المكالمة انتهت</div>
        <div class="finish-sub">مدة المكالمة: ${m}:${s2}</div>
      </div>
    </div>
    <div class="main-card">
      <div class="stage-name" style="margin-bottom:12px">ملخص العميل</div>
      <div class="summary-box">
        <div class="summary-line"><div class="summary-key">الاسم</div><div class="summary-val">${state.name}</div></div>
        <div class="summary-line"><div class="summary-key">الهاتف</div><div class="summary-val">${state.phone || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">المصدر</div><div class="summary-val">${state.source || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">النشاط</div><div class="summary-val">${state.biz || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">الموظفين</div><div class="summary-val">${state.employees || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">الفروع</div><div class="summary-val">${state.branches || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">النظام الحالي</div><div class="summary-val">${state.currentSys || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">المشاكل</div><div class="summary-val">${state.pains.join('، ') || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">قوة الألم</div><div class="summary-val">${state.painLevel || '—'}</div></div>
        <div class="summary-line"><div class="summary-key">النتيجة</div><div class="summary-val">${outcomeLabels[state.outcome] || '—'}</div></div>
        ${state.note ? `<div class="summary-line"><div class="summary-key">ملاحظة</div><div class="summary-val">${state.note}</div></div>` : ''}
      </div>
      <button class="btn-next" onclick="resetApp()"><i class="ti ti-phone-plus" aria-hidden="true"></i> مكالمة جديدة</button>
    </div>`;
  document.getElementById('stages-bar').innerHTML = STAGES.map(() => `<div class="stage-dot done"></div>`).join('');
}

function resetApp() {
  state = { name:'', phone:'', source:'', stage:0, biz:'', employees:'', branches:'', currentSys:'', pains:[], painLevel:'', impacts:[], outcome:'', note:'', askedQs:{}, timerSec:0 };
  document.getElementById('start-view').style.display = 'block';
  document.getElementById('call-view').style.display = 'none';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-phone').value = '';
  document.querySelectorAll('#source-btns .choice-btn').forEach(b => b.classList.remove('selected'));
}
</script>
